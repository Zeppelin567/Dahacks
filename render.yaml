# BikeScape: public website and Python routing at one HTTPS origin.
services:
  - type: web
    name: dahacks-bikemap
    branch: main
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/py/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: mock

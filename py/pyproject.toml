[project]
name = "mvp-py"
version = "0.1.0"
description = "Optional FastAPI side-car for the MVP starter. Reached only through the api at /api/py/*."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pillow>=10",
  "osmnx>=2",
  "networkx>=3",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]
pipeline = [
    "matplotlib>=3.11.2",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-include = ["../examples/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
